<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#23382c">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src https://xjiyiwzzqghhgzxdqvhy.supabase.co wss://xjiyiwzzqghhgzxdqvhy.supabase.co; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>Земля — CRM для подбора</title>
<script src="./theme.js"></script>
<link rel="stylesheet" href="./styles.css?v=8">
</head>
<body>
<main id="team-account" class="team-auth">
  <button class="icon-button theme-toggle auth-theme" type="button" data-theme-switch aria-label="Тёмная тема" aria-pressed="false">
    <span class="theme-moon" data-icon="moon"></span><span class="theme-sun" data-icon="sun"></span>
  </button>
  <div class="auth-composition">
    <div class="auth-scene" aria-hidden="true">
      <div class="earth-illustration auth-globe" data-globe="auth">
        <div class="earth-orbit"></div>
        <div class="earth-frame"><img src="./assets/earth.jpg" alt="" width="340" height="340"></div>
        <canvas class="earth-live" width="408" height="408"></canvas>
        <img class="earth-texture" src="./assets/earth-texture.jpg" alt="">
      </div>
    </div>
    <section class="team-auth-panel" id="auth-content" aria-labelledby="auth-title"><p>Проверяем вход…</p></section>
  </div>
</main>
<div class="layout" hidden>
  <aside class="sidebar">
    <a class="brand" href="#" data-view="board"><span class="brand-mark" data-icon="logo"></span><span>Земля<span class="brand-sub">CRM для подбора</span></span></a>
    <nav class="primary-nav" aria-label="Рабочее пространство">
      <p class="nav-label">Рабочее пространство</p>
      <button class="nav-btn active" data-view="board"><span data-icon="board"></span>Воронка</button>
      <button class="nav-btn" data-view="list"><span data-icon="list"></span><span id="team-list-label">Мои лиды</span></button>
      <button class="nav-btn" data-view="callback"><span data-icon="clock"></span>Перезвонить позже<span class="nav-count" id="callback-count" hidden></span></button>
      <button class="nav-btn" data-view="archive"><span data-icon="archive"></span>Отказ<span class="nav-count" id="archive-count" hidden></span></button>
      <button class="nav-btn" data-view="history" data-owner hidden><span data-icon="history"></span>История импорта</button>
    </nav>
    <nav class="sidebar-footer" aria-label="Управление CRM">
      <button class="nav-btn" id="team-people"><span data-icon="user"></span>Сотрудники</button>
      <button class="nav-btn" id="export" data-owner hidden><span data-icon="download"></span>Экспорт откликов</button>
      <button class="nav-btn" id="backup" data-owner hidden><span data-icon="archive"></span>Резервная копия</button>
    </nav>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="crumb"><span>Рабочее пространство</span><span data-icon="right"></span><strong id="crumb-current">Воронка</strong></div>
      <div class="topbar-actions">
        <button type="button" class="button primary transfer-open" id="team-assign" aria-haspopup="dialog"><span data-icon="send"></span>Передать лиды</button>
        <button class="icon-button theme-toggle" type="button" data-theme-switch aria-label="Тёмная тема" aria-pressed="false">
          <span class="theme-moon" data-icon="moon"></span><span class="theme-sun" data-icon="sun"></span>
        </button>
        <div class="profile">
          <span class="profile-avatar" data-icon="user"></span>
          <div><strong id="team-who"></strong><small id="team-role"></small></div>
          <button class="icon-button logout" id="mode" type="button" aria-label="Выйти" title="Выйти"><span data-icon="logout"></span></button>
        </div>
      </div>
    </header>

    <div class="workspace">
      <header class="page-heading">
        <div class="hero-copy">
          <span class="sync-pill" id="sync-status" role="status" aria-live="polite"></span>
          <h1 id="page-title">Воронка кандидатов</h1>
          <p id="page-description">Ваши кандидаты и этапы работы с ними.</p>
        </div>
        <div class="earth-illustration" data-globe="hero" aria-hidden="true">
          <div class="earth-orbit"></div>
          <div class="earth-frame"><img src="./assets/earth.jpg" alt="" width="340" height="340"></div>
          <canvas class="earth-live" width="284" height="284"></canvas>
          <img class="earth-texture" src="./assets/earth-texture.jpg" alt="">
        </div>
      </header>

      <section class="pipeline" id="pipeline" aria-label="Отклики">
        <header class="pipeline-heading">
          <h2 id="pipeline-title">Мои лиды</h2>
          <div class="top-actions">
            <button class="button" type="button" id="new-lead" data-owner hidden><span data-icon="plus"></span>Новый лид</button>
            <button class="button primary" type="button" data-import data-owner hidden><span data-icon="upload"></span>Загрузить отклики</button>
          </div>
        </header>
        <div class="toolbar">
          <div class="switcher" aria-label="Вид откликов">
            <button type="button" data-view="board"><span data-icon="board"></span>Доска</button>
            <button type="button" data-view="list"><span data-icon="list"></span>Список</button>
          </div>
          <div class="filters">
            <label class="search"><span data-icon="search"></span><input id="search" type="search" placeholder="Имя или телефон" aria-label="Поиск по имени, телефону или вакансии"></label>
            <label class="vacancy-filter"><span data-icon="briefcase"></span><select id="vacancies" aria-label="Фильтр по вакансии"><option value="">Все вакансии</option></select></label>
            <details class="filter-menu">
              <summary class="button"><span data-icon="filter"></span>Фильтры</summary>
              <div class="advanced-filters">
                <label>Дата с<input id="date-from" type="date"></label>
                <label>По<input id="date-to" type="date"></label>
                <label id="status-control">Статус<select id="status-filter"><option value="">Все статусы</option></select></label>
                <label class="due-toggle" id="due-control"><input type="checkbox" id="only-due"> Просроченные</label>
                <button type="button" class="button ghost" id="clear-filters" hidden>Сбросить фильтры</button>
              </div>
            </details>
          </div>
        </div>
        <div class="board-toolbar" id="board-toolbar">
          <div class="board-controls" id="board-controls">
            <button class="icon-button" type="button" id="scroll-left" aria-label="Этапы влево"><span data-icon="left"></span></button>
            <button class="icon-button" type="button" id="scroll-right" aria-label="Этапы вправо"><span data-icon="right"></span></button>
          </div>
        </div>
        <div id="results"></div>
      </section>
      <section id="history" hidden aria-label="Журнал загрузок"></section>
    </div>
  </main>
</div>
<dialog id="dialog" aria-labelledby="dialog-title"></dialog>
<input id="import-file" type="file" accept=".xlsx,.csv,.tsv" hidden>
<input id="backup-file" type="file" accept=".json,application/json" hidden>
<div class="toast" id="toast" role="status" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0" integrity="sha384-gnyZit14c5lnGcarmA166QQjjJXpucw25ogZXuwH3HxxY904zHkBqmxVpelsPorb" crossorigin="anonymous"></script>
<script src="./supabase-crm.js?v=8"></script>
<script src="./app.js?v=8"></script>
</body>
</html>
